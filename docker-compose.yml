services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-vroom-db
    environment:
      POSTGRES_DB: trading_vroom
      POSTGRES_USER: trading_vroom
      POSTGRES_PASSWORD: trading_vroom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_vroom"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: trading-vroom-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trading_vroom
      SPRING_DATASOURCE_USERNAME: trading_vroom
      SPRING_DATASOURCE_PASSWORD: trading_vroom
      VROOM_API_KEY: MySuperSecretVroomKey0209
    restart: unless-stopped

volumes:
  postgres_data:
